# PINNED BACK to 61.1.0 deliberately. Forge 61.1.8 and every build after it (61.1.16, 61.2.0,
# 61.2.1) ship a binpatch for mcp/client/Start, which FG6 also injects itself -- two different
# files landing on one zip path. MinecraftUserRepo.findRaw refuses the collision:
#   java.util.zip.ZipException: duplicate entry: mcp/client/Start.class
# Note 61.2.0 is the RECOMMENDED build and is broken too; recommended is not a safe fallback here.
# The FG cache is NOT involved -- 61.1.0 re-derives from scratch in ~45s, content-identical.
# Cheap retry test: LZMA-decompress that build's binpatches.lzma and search for mcp/client/Start.
# Zero occurrences = it will build. Non-zero = it will throw. No toolchain run needed.
# check_pins.py will keep reporting this as BEHIND. That is correct and expected:
# being behind a pin that cannot build is not a reason to ship a broken cell.
forge_version=1.21.11-61.1.0
